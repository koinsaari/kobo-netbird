name: Release

on:
  push:
    branches: [main]
    paths: [Makefile, "rootfs/**", "drive/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a minor or major release, e.g. v1.1.0; empty bumps the patch
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            v=$INPUT
          else
            last=$(gh release list --exclude-drafts --limit 100 --json tagName -q '.[].tagName' | sort -V | tail -n1)
            IFS=. read -r major minor patch <<<"$last"
            v=$major.$minor.$((patch + 1))
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - run: make

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/KoboRoot.tgz
            build/kobo-netbird.zip

      - name: Replace the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' |
            while read -r t; do gh release delete "$t" --yes; done
          gh release create "$VERSION" build/KoboRoot.tgz build/kobo-netbird.zip build/SHA256SUMS \
            --draft --target "$GITHUB_SHA" --generate-notes \
            --notes "Bundles netbird $(sed -n 's/^NETBIRD_VERSION := //p' Makefile)."
